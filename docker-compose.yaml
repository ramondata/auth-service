services:
  auth_db:
    image: postgres
    environment:
      POSTGRES_DB: meteora_db
      POSTGRES_USER: meteora_user
      POSTGRES_PASSWORD: meteora_password
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql  
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meteora_user -d meteora_db"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 1m
    networks:
      - authNetwork

  auth-service:
    build: .
    depends_on:
      auth_db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://meteora_user:meteora_password@auth_db:5432/meteora_db
      PORT: 8001
      MASTER_KEY: admin-secreto-123
    ports:
      - "8001:8001"
    networks:
      - authNetwork

networks:
  authNetwork:
volumes:
  pgdata: