apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service-v2
  namespace: auth-v2
spec:
  replicas: 1

  selector:
    matchLabels:
      app: auth-service-v2

  template:
    metadata:
      labels:
        app: auth-service-v2

    spec:
      containers:
        - name: auth-service-v2

          image: 992382782782.dkr.ecr.us-east-2.amazonaws.com/challenge2/auth-service-auth-service:v1

          imagePullPolicy: Always

          ports:
            - containerPort: 8001

          envFrom:
            - configMapRef:
                name: auth-config

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"
