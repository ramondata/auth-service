name: Auth Service CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - aws-cloud-k8s

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    name: Auth Service CI

    uses: ramondata/CI-reusable-source/.github/workflows/ci-reusable.yml@v1.2.0

    permissions:
      contents: read
      id-token: write
      
    with:
      aws-region: ${{ vars.AWS_REGION }}
      aws-role-arn: ${{ vars.AWS_ROLE_ARN }}
      ecr-repository: ${{ vars.ECR_REPOSITORY }}
      image-name: "auth-service"
      app-version: ${{ vars.APP_VERSION }}